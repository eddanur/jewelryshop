<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Ara | EDDE JEWELRY</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #fafafa; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background-color: #fff; border-bottom: 1px solid #f0f0f0; }
        .logo-box { border: 2px solid #d4af37; padding: 8px 15px; display: inline-block; }
        .logo { font-family: 'Playfair Display', serif; font-size: 16px; letter-spacing: 3px; font-weight: 600; color: #000; text-decoration: none; }

        .search-container { max-width: 800px; margin: 60px auto 40px; text-align: center; padding: 0 20px; }
        .search-input-box input { width: 100%; padding: 20px 25px; font-size: 16px; border: 2px solid #eedcbf; border-radius: 50px; outline: none; transition: 0.3s; }
        .search-input-box input:focus { border-color: #d4af37; }

        .results-section { max-width: 1200px; margin: 0 auto 80px; padding: 0 20px; }
        .results-info { font-size: 14px; color: #555; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }

        .products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }
        .product-card { background: #fff; padding-bottom: 15px; border-radius: 4px; text-align: center; cursor: pointer; transition: transform 0.3s; text-decoration: none; color: inherit; display: block; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .product-card:hover { transform: translateY(-10px); }
        .product-card img { width: 100%; height: 250px; object-fit: cover; border-top-left-radius: 4px; border-top-right-radius: 4px; margin-bottom: 15px; }
        .p-card-title { font-size: 13px; font-weight: 500; color: #333; }
        .p-card-price { font-size: 15px; font-weight: 600; color: #d4af37; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-box"><div class="logo">EDDE JEWELRY</div></a>
    <a href="index.html" style="color:#555; text-decoration:none; font-size:14px;">✕ Kapat</a>
</header>

<div class="search-container">
    <h1>Ne aramıştınız?</h1>
    <div class="search-input-box">
        <input type="text" id="searchInput" placeholder="Ürün adı, kategori veya özellik arayın..." onkeyup="filtrele()">
    </div>
</div>

<div class="results-section">
    <div class="results-info" id="sonucYazisi">Tüm ürünler yükleniyor...</div>
    <div class="products-grid" id="urunListesi"></div>
</div>

<script>
    const authHeader = 'Basic ' + btoa('admin:admin123');
    let tumUrunler = [];

    // Sayfa açıldığında tüm ürünleri veritabanından çek
    async function verileriGetir() {
        try {
            const res = await fetch('http://localhost:8080/api/products', { headers: { 'Authorization': authHeader }});
            tumUrunler = await res.json();
            ekranaBas(tumUrunler);
        } catch (err) { document.getElementById("sonucYazisi").innerText = "Ürünler yüklenirken bir hata oluştu."; }
    }

    function ekranaBas(liste) {
        const grid = document.getElementById("urunListesi");
        grid.innerHTML = "";
        liste.forEach(urun => {
            grid.innerHTML += `
                <a href="urun-detay.html?id=${urun.id}" class="product-card">
                    <img src="${urun.imageUrl || 'https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=400'}" alt="${urun.name}">
                    <div class="p-card-title">${urun.name}</div>
                    <div class="p-card-price">${urun.price} ₺</div>
                </a>`;
        });
        document.getElementById("sonucYazisi").innerText = liste.length + " sonuç bulundu.";
    }

    function filtrele() {
        const kelime = document.getElementById("searchInput").value.toLowerCase();
        const filtrelenmis = tumUrunler.filter(u =>
            u.name.toLowerCase().includes(kelime) ||
            u.category.toLowerCase().includes(kelime)
        );
        ekranaBas(filtrelenmis);
    }

    window.onload = verileriGetir;
</script>
</body>
</html>
