<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alışveriş Sepeti | EDDE JEWELRY</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #fafafa; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background-color: #fff; border-bottom: 1px solid #f0f0f0; }
        .logo-box { border: 2px solid #d4af37; padding: 8px 15px; display: inline-block; }
        .logo { font-family: 'Playfair Display', serif; font-size: 16px; letter-spacing: 3px; font-weight: 600; color: #000; text-transform: uppercase; text-decoration: none; }

        .cart-wrapper { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: flex; gap: 30px; flex-wrap: wrap; }
        .cart-left { flex: 2; min-width: 300px; background-color: #fff; padding: 30px; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); border: 1px solid #eedcbf; }
        .cart-title { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 25px; color: #111; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid #f9f9f9; }
        .cart-item img { width: 90px; height: 110px; object-fit: cover; border-radius: 4px; }
        .item-details { flex: 1; padding-left: 20px; }
        .item-title { font-size: 15px; font-weight: 500; margin-bottom: 5px; color: #222; }
        .qty-controls { display: flex; align-items: center; gap: 15px; margin-top: 5px; }
        .qty-box { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 4px; width: 90px; }
        .qty-btn { background-color: #f9f9f9; border: none; padding: 5px 12px; cursor: pointer; }
        .qty-num { flex: 1; text-align: center; font-size: 14px; border-left: 1px solid #ddd; border-right: 1px solid #ddd; padding: 5px 0; }
        .item-price { font-weight: 600; color: #d4af37; font-size: 16px; text-align: right; }
        .btn-remove { background: none; border: none; color: #ff4d4d; font-size: 12px; cursor: pointer; margin-top: 10px; text-decoration: underline; }

        .cart-right { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .summary-box, .payment-box { background-color: #fff; padding: 25px; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); border: 1px solid #f0f0f0; }
        .summary-total { font-size: 18px; font-weight: 600; color: #d4af37; display: flex; justify-content: space-between; margin-top: 15px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: 'Poppins', sans-serif; font-size: 13px; }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .section-title { font-size: 14px; font-weight: 600; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 10px; }
        .btn-pay { width: 100%; background: #111; color: #fff; padding: 15px; border: none; cursor: pointer; text-transform: uppercase; font-weight: 600; margin-top: 15px; border-radius: 4px; transition: 0.3s; }
        .btn-pay:hover { background: #d4af37; }
    </style>
</head>
<body onload="sepetiYukle()">

<header>
    <a href="index.html" class="logo-box"><div class="logo">EDDE JEWELRY</div></a>
</header>

<div class="cart-wrapper">
    <div class="cart-left" id="cartItemsContainer"><h2 class="cart-title">Alışveriş Sepetiniz</h2></div>
    <div class="cart-right">
        <div class="summary-box">
            <h3 class="box-title" style="font-family: 'Playfair Display'; font-size:20px;">Sipariş Özeti</h3>
            <div class="summary-total">Ödenecek Tutar: <span id="genelToplamMetni">0 ₺</span></div>
        </div>
        <div class="payment-box">
            <form onsubmit="orderComplete(event)">

                <div class="section-title">Teslimat Bilgileri</div>
                <div class="form-group"><label>Ad Soyad</label><input type="text" id="aliciIsim" placeholder="Örn: Edanur Dede" required></div>
                <div class="form-group">
                    <label>Şehir</label>
                    <select id="aliciSehir" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: 'Poppins', sans-serif; font-size: 13px; outline: none; cursor: pointer;">
                        <option value="" disabled selected>Lütfen bir şehir seçiniz...</option>
                        <option value="Adana">Adana</option>
                        <option value="Adıyaman">Adıyaman</option>
                        <option value="Afyonkarahisar">Afyonkarahisar</option>
                        <option value="Ağrı">Ağrı</option>
                        <option value="Amasya">Amasya</option>
                        <option value="Ankara">Ankara</option>
                        <option value="Antalya">Antalya</option>
                        <option value="Artvin">Artvin</option>
                        <option value="Aydın">Aydın</option>
                        <option value="Balıkesir">Balıkesir</option>
                        <option value="Bilecik">Bilecik</option>
                        <option value="Bingöl">Bingöl</option>
                        <option value="Bitlis">Bitlis</option>
                        <option value="Bolu">Bolu</option>
                        <option value="Burdur">Burdur</option>
                        <option value="Bursa">Bursa</option>
                        <option value="Çanakkale">Çanakkale</option>
                        <option value="Çankırı">Çankırı</option>
                        <option value="Çorum">Çorum</option>
                        <option value="Denizli">Denizli</option>
                        <option value="Diyarbakır">Diyarbakır</option>
                        <option value="Edirne">Edirne</option>
                        <option value="Elazığ">Elazığ</option>
                        <option value="Erzincan">Erzincan</option>
                        <option value="Erzurum">Erzurum</option>
                        <option value="Eskişehir">Eskişehir</option>
                        <option value="Gaziantep">Gaziantep</option>
                        <option value="Giresun">Giresun</option>
                        <option value="Gümüşhane">Gümüşhane</option>
                        <option value="Hakkari">Hakkari</option>
                        <option value="Hatay">Hatay</option>
                        <option value="Isparta">Isparta</option>
                        <option value="Mersin">Mersin</option>
                        <option value="İstanbul">İstanbul</option>
                        <option value="İzmir">İzmir</option>
                        <option value="Kars">Kars</option>
                        <option value="Kastamonu">Kastamonu</option>
                        <option value="Kayseri">Kayseri</option>
                        <option value="Kırklareli">Kırklareli</option>
                        <option value="Kırşehir">Kırşehir</option>
                        <option value="Kocaeli">Kocaeli</option>
                        <option value="Konya">Konya</option>
                        <option value="Kütahya">Kütahya</option>
                        <option value="Malatya">Malatya</option>
                        <option value="Manisa">Manisa</option>
                        <option value="Kahramanmaraş">Kahramanmaraş</option>
                        <option value="Mardin">Mardin</option>
                        <option value="Muğla">Muğla</option>
                        <option value="Muş">Muş</option>
                        <option value="Nevşehir">Nevşehir</option>
                        <option value="Niğde">Niğde</option>
                        <option value="Ordu">Ordu</option>
                        <option value="Rize">Rize</option>
                        <option value="Sakarya">Sakarya</option>
                        <option value="Samsun">Samsun</option>
                        <option value="Siirt">Siirt</option>
                        <option value="Sinop">Sinop</option>
                        <option value="Sivas">Sivas</option>
                        <option value="Tekirdağ">Tekirdağ</option>
                        <option value="Tokat">Tokat</option>
                        <option value="Trabzon">Trabzon</option>
                        <option value="Tunceli">Tunceli</option>
                        <option value="Şanlıurfa">Şanlıurfa</option>
                        <option value="Uşak">Uşak</option>
                        <option value="Van">Van</option>
                        <option value="Yozgat">Yozgat</option>
                        <option value="Zonguldak">Zonguldak</option>
                        <option value="Aksaray">Aksaray</option>
                        <option value="Bayburt">Bayburt</option>
                        <option value="Karaman">Karaman</option>
                        <option value="Kırıkkale">Kırıkkale</option>
                        <option value="Batman">Batman</option>
                        <option value="Şırnak">Şırnak</option>
                        <option value="Bartın">Bartın</option>
                        <option value="Ardahan">Ardahan</option>
                        <option value="Iğdır">Iğdır</option>
                        <option value="Yalova">Yalova</option>
                        <option value="Karabük">Karabük</option>
                        <option value="Kilis">Kilis</option>
                        <option value="Osmaniye">Osmaniye</option>
                        <option value="Düzce">Düzce</option>
                    </select>
                </div>
                <div class="form-group"><label>Açık Adres</label><textarea id="aliciAdres" placeholder="Mahalle, Sokak, No..." required></textarea></div>

                <div class="section-title">Ödeme Bilgileri</div>
                <div class="form-group"><label>Kart Üzerindeki İsim</label><input type="text" placeholder="Ad Soyad" required></div>
                <div class="form-group"><label>Kart Numarası</label><input type="text" maxlength="19" oninput="formatKartNo(this)" placeholder="0000 0000 0000 0000" required></div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group"><label>Son Kullanma</label><input type="text" maxlength="5" oninput="formatTarih(this)" placeholder="AA/YY" required></div>
                    <div class="form-group"><label>CVC / CCV</label><input type="password" maxlength="3" placeholder="***" required onkeypress="return event.charCode >= 48 && event.charCode <= 57"></div>
                </div>

                <button type="submit" class="btn-pay" id="satinAlButonu">Siparişi Tamamla</button>
            </form>
        </div>
    </div>
</div>

<script>
    function formatKartNo(i) { i.value = i.value.replace(/\D/g, '').replace(/(.{4})/g, '$1 ').trim(); }
    function formatTarih(i) { i.value = i.value.replace(/\D/g, '').replace(/(.{2})/, '$1/').substring(0, 5); }

    let globalToplamTutar = 0;

    function sepetiYukle() {
        let sepet = JSON.parse(localStorage.getItem('edde_sepet')) || [];
        let container = document.getElementById('cartItemsContainer');
        container.innerHTML = '<h2 class="cart-title">Alışveriş Sepetiniz</h2>';
        let genelToplam = 0;

        if (sepet.length === 0) {
            container.innerHTML += '<p style="padding:20px; color:#777;">Sepetiniz şu an boş.</p>';
            document.getElementById('satinAlButonu').disabled = true;
            document.getElementById('satinAlButonu').style.background = '#ccc';
        } else {
            document.getElementById('satinAlButonu').disabled = false;
            document.getElementById('satinAlButonu').style.background = '#111';
        }

        sepet.forEach((urun, index) => {
            let fiyatSayi = parseInt(urun.fiyat.replace(/\D/g, ''));
            let satirToplam = fiyatSayi * urun.adet;
            genelToplam += satirToplam;

            container.innerHTML += `
            <div class="cart-item">
                <img src="${urun.resim}">
                <div class="item-details">
                    <div class="item-title">${urun.isim}</div>
                    <div class="qty-controls">
                        <div class="qty-box">
                            <button class="qty-btn" type="button" onclick="adetDegistir(${index}, -1)">-</button>
                            <div class="qty-num">${urun.adet}</div>
                            <button class="qty-btn" type="button" onclick="adetDegistir(${index}, 1)">+</button>
                        </div>
                        <button class="btn-remove" onclick="sepettenCikar(${index})">Ürünü Çıkar</button>
                    </div>
                </div>
                <div class="item-price">${satirToplam.toLocaleString('tr-TR')} ₺</div>
            </div>`;
        });

        globalToplamTutar = genelToplam;
        document.getElementById('genelToplamMetni').innerText = genelToplam.toLocaleString('tr-TR') + ' ₺';
        document.getElementById('satinAlButonu').innerText = "Siparişi Tamamla (" + genelToplam.toLocaleString('tr-TR') + " ₺)";
    }

    function adetDegistir(index, degisim) {
        let sepet = JSON.parse(localStorage.getItem('edde_sepet')) || [];
        sepet[index].adet = Math.max(1, sepet[index].adet + degisim);
        localStorage.setItem('edde_sepet', JSON.stringify(sepet));
        sepetiYukle();
    }

    // Sepetten ürün silme (Müşteri iptal/çıkarma hakkı)
    function sepettenCikar(index) {
        let sepet = JSON.parse(localStorage.getItem('edde_sepet')) || [];
        sepet.splice(index, 1);
        localStorage.setItem('edde_sepet', JSON.stringify(sepet));
        sepetiYukle();
    }

    // Siparişi tamamla ve Siparişlerim sayfasına aktar
    function orderComplete(e) {
        e.preventDefault();

        let sepet = JSON.parse(localStorage.getItem('edde_sepet')) || [];
        if(sepet.length === 0) return;

        // Formdaki bilgileri al
        let isim = document.getElementById('aliciIsim').value;
        let sehir = document.getElementById('aliciSehir').value;
        let adres = document.getElementById('aliciAdres').value;

        // Eski siparişleri getir
        let siparisler = JSON.parse(localStorage.getItem('siparisler')) || [];

        // Yeni sipariş paketi
        let yeniSiparis = {
            siparisNo: 'EDDE-' + Math.floor(100000 + Math.random() * 900000),
            tarih: new Date().toLocaleDateString('tr-TR'),
            saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
            aliciBilgisi: isim + ' - ' + sehir,
            aliciAdres: adres,
            urunler: sepet,
            toplamTutarText: globalToplamTutar.toLocaleString('tr-TR') + " ₺",
            durum: 'Hazırlanıyor 📦'
        };

        // Siparişi kaydet, sepeti boşalt
        siparisler.unshift(yeniSiparis);
        localStorage.setItem('siparisler', JSON.stringify(siparisler));
        localStorage.removeItem('edde_sepet');

        alert("Siparişiniz başarıyla alındı! 🎉 Siparişlerim sayfasına yönlendiriliyorsunuz.");
        window.location.href="siparislerim.html";
    }

</script>
</body>
</html>
